<section class="archery-dashboard">
  <div class="dashboard-upper">
    <div class="flex-center mt-2 mb-3">
      <img class="w-45 box-shadow border-radius-circle" src="assets/images/archery_target.png" alt="archery target">
    </div>
    <div class="flex-center flex-column w-100">
      <button mat-raised-button color="accent" class="archery-button">
        <div class="flex flex-align-center">
          <img class="dash-icon mr-5" src="assets/images/archery/scoring.png" alt="">
          <p class="text-color-light-grey fs-xl">Scoring</p>
        </div>
      </button>
      <button mat-raised-button color="accent" class="archery-button">
        <div class="flex flex-align-center">
          <img class="dash-icon mr-5" src="assets/images/archery/equipment.png" alt="">
          <p class="text-color-light-grey fs-xl">Equipment</p>
        </div>
      </button>
      <button mat-raised-button color="accent" class="archery-button">
        <div class="flex flex-align-center">
          <img class="dash-icon mr-5" src="assets/images/archery/settings.png" alt="">
          <p class="text-color-light-grey fs-xl">Settings</p>
        </div>
      </button>
      <button mat-raised-button color="accent" class="archery-button">
        <div class="flex flex-align-center">
          <img class="dash-icon mr-5" src="assets/images/archery/reports.png" alt="">
          <p class="text-color-light-grey fs-xl">Reports</p>
        </div>
      </button>
    </div>
  </div>
  <div class="w-100 flex-center mb-2">
    <button mat-fab class="p-2 mx-2 flex-center invisible-button">
      <img src="assets/images/archery/settings_gear.png" alt="">
    </button>
    <button mat-fab color="accent" class="p-2 mx-2 flex-center">
      <img src="assets/images/archery/home.png" alt="">
    </button>
    <button mat-fab color="accent" class="p-2 mx-2 flex-center">
      <img src="assets/images/archery/profile.png" alt="">
    </button>
  </div>
</section>
