publish-container:
  image: docker:latest
  stage: publish-container
  services:
    - docker:dind
  script:
    - docker build -t $TAG_COMMIT -t ${TAG_LATEST}-container:latest .
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker push $TAG_COMMIT
    - docker push $TAG_LATEST-container:latest
