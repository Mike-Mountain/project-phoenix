default:
  interruptible: true
  image: node:lts-alpine

stages:
  - install
  - lint
  - test
  - build-container
  - build-budgets
  - build-code-master
  - build-gallery
  - build-groups
  - build-movies
  - build-resume
  - publish-container
  - publish-budgets
  - publish-code-master
  - publish-gallery
  - publish-groups
  - publish-movies
  - publish-resume
  - release

variables:
  TAG_LATEST: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME
  TAG_COMMIT: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:$CI_COMMIT_SHORT_SHA

install:
  stage: install
  script:
    - echo "Installing dependencies"
    - npm install --legacy-peer-deps --prefer-offline
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules

