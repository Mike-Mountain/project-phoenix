default:
  interruptible: true
  image: node:lts-alpine

stages:
  - install
  - lint
  - test
  - build
  - publish
  - release

variables:
  TAG_LATEST: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:latest
  TAG_COMMIT: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:$CI_COMMIT_SHORT_SHA

install:
  stage: install
  script:
    - echo "Installing dependencies"
    - npm install --legacy-peer-deps --prefer-offline
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules

lint:
  stage: lint
  needs: [ "install" ]
  script:
    - apk update && apk add git
    - NX_HEAD=$CI_COMMIT_SHA
    - NX_BASE=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}
    - npm run list:affected -- --base=$NX_BASE -- --head=$NX_HEAD
    - echo "AFFECTED_APPS=npm run list:affected -- --base=$NX_BASE -- --head=$NX_HEAD" >> affected.env
#    - npm run lint:affected
  artifacts:
    reports:
      dotenv: affected.env
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules
    policy: pull

test:
  stage: test
  needs: [ "install" ]
  script:
    - echo "Add tests!"

build:
  stage: build
  needs: [ "lint", "test" ]
  script:
    - echo $AFFECTED_APPS
    - npm run build:affected
  artifacts:
    paths:
      - $CI_PROJECT_DIR/dist/apps
  cache:
    key:
      files:
        - package.json
    paths:
      - node_modules
    policy: pull

